name: Android

# Two lanes, deliberately not the same work twice.
#
#   pull_request -> verify. Tests, lint, debug build. This is the gate.
#   push: master -> ship.   Signed release, no tests.
#
# A squash merge produces a new SHA over content the PR already proved, so
# re-running the suite on master buys nothing and delays the artifact. The
# safety this trades away is the case where master moved after the PR was
# checked: enable "require branches to be up to date before merging" on the
# branch rule and that gap closes. Direct pushes to master skip the gate
# entirely, which is what the branch rule is for.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint and debug build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      # Also runs checkDebugNoNetworkPermission, wired into assemble. A network
      # permission fails the build here.
      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: saku-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  ship:
    name: Signed release build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Written outside the checkout so it cannot be picked up by a build script
      # or committed by accident, and removed even when the build fails.
      - name: Decode keystore
        id: keystore
        env:
          SAKU_KEYSTORE_B64: ${{ secrets.SAKU_KEYSTORE_B64 }}
        run: |
          # Guarded in the script rather than with `if:`, because a step's own env
          # is not in scope when its `if` is evaluated. An empty secret leaves the
          # output unset, which leaves the build unsigned.
          if [ -z "$SAKU_KEYSTORE_B64" ]; then
            echo "No keystore secret; release will be unsigned."
            exit 0
          fi
          printf '%s' "$SAKU_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/saku.jks"
          echo "path=$RUNNER_TEMP/saku.jks" >> "$GITHUB_OUTPUT"

      # Also runs checkReleaseNoNetworkPermission, so the permission gate still
      # covers this lane even though the unit tests do not run here.
      - name: Assemble release
        env:
          SAKU_KEYSTORE: ${{ steps.keystore.outputs.path }}
          SAKU_KEYSTORE_PASSWORD: ${{ secrets.SAKU_KEYSTORE_PASSWORD }}
          SAKU_KEY_ALIAS: ${{ secrets.SAKU_KEY_ALIAS }}
          SAKU_KEY_PASSWORD: ${{ secrets.SAKU_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Shred keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/saku.jks"

      # Signed when the four SAKU_* secrets are present, unsigned otherwise. The
      # file name says which: AGP writes app-release.apk when signed and
      # app-release-unsigned.apk when not.
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: saku-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  e2e:
    name: Maestro e2e
    # Emulator runs are slow, so keep them off pull requests. They run on master
    # after a merge, and on demand.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            maestro test .maestro --exclude-tags pending-shell \
              --format junit --output maestro-report.xml

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: |
            maestro-report.xml
            ~/.maestro/tests/
          if-no-files-found: ignore
