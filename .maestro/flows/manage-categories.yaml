appId: com.dvnnfrr.saku
name: Manage categories
---
# Task 9.7. Create, rename and archive categories. There are no subcategories here:
# they were dropped in favour of search on 30 Oct 2026, so a row has no expand control
# and its menu offers no "Add subcategory".
#
# A first run seeds no categories, so the screen opens empty and the flow makes its own.
# Requires the More menu's Categories row to be routed at this screen.
- clearState
- launchApp

- tapOn: "More"
- tapOn: "Categories"
- assertVisible: "Categories"
- assertVisible: "Expense"
- assertVisible: "No categories on this tab yet"

- tapOn: "New category"
- assertVisible: "New category"
- inputText: "Hadiah"
- tapOn: "Create"
- assertVisible: "Hadiah"
- assertNotVisible: "No categories on this tab yet"

# Tapping the row opens its actions, and none of them is about subcategories.
- tapOn: "Hadiah"
- assertVisible: "Rename"
- assertNotVisible: "Add subcategory"
- pressKey: Back

# A category of its own, created from the header, appended to the end of the list.
- tapOn: "New category"
- assertVisible: "New category"
- inputText: "Asuransi"
- tapOn: "Create"

- scrollUntilVisible:
    element: "Asuransi"
    direction: DOWN

# Rename it. The transactions filed against it keep pointing at the same row, which is
# the whole reason rename exists instead of delete-and-recreate.
- tapOn: "Actions for Asuransi"
- tapOn: "Rename"
- tapOn: "Name"
- eraseText
- inputText: "Asuransi Jiwa"
- tapOn: "Save"
- assertVisible: "Asuransi Jiwa"

# Archive, never delete. The row leaves the list and the pickers; it does not leave the
# database, and the archived section is where it can be brought back from.
- tapOn: "Actions for Asuransi Jiwa"
- tapOn: "Archive"
- assertNotVisible: "Asuransi Jiwa"

- scrollUntilVisible:
    element: "Show archived (1)"
    direction: DOWN
- tapOn: "Show archived (1)"
- assertVisible: "Asuransi Jiwa"
