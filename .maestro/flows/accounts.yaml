appId: com.dvnnfrr.saku
name: Accounts and the balance donut
---
# Task 10.7, plus the list-and-donut half of track D's definition of done.
#
# Runs on a freshly seeded install, so the two default accounts (Cash and Card) exist
# and both open at zero. That is what makes the first block worth asserting: with nothing
# held anywhere the donut must say so rather than draw a ring of nothing, and the
# Liabilities figure must be absent rather than sitting at zero.
- clearState
- launchApp

- tapOn: "Accounts"

# The header. Two figures, not three, until a liability account exists.
- assertVisible: "Spendable"
- assertVisible: "Invested"
- assertVisible: "Net worth"
- assertNotVisible: "Liabilities"

# The seeded two, under their type headings, neither balance checked yet.
- assertVisible: "Cash"
- assertVisible: "Card"
- assertVisible: "Balance not checked yet"

# Nothing holds a positive balance, so the split bar is replaced by a prompt.
- assertVisible: "Add an opening balance to see your total"

# Add an account with a real opening balance.
- tapOn: "Add account"
- assertVisible: "New account"

- tapOn: "Name"
- inputText: "Gopay"

- tapOn: "Opening balance"
- inputText: "500000"

- tapOn: "Create"

# It joins the list, and with one positive balance the split bar replaces the prompt.
- assertVisible: "Gopay"
- assertNotVisible: "Add an opening balance to see your total"

# Into the account, and check its balance against to a figure 50.000 lower than the app believes.
- tapOn: "Gopay"
- assertVisible: "Balance not checked yet"

- tapOn: "Check balance"
- assertVisible: "Check the Gopay balance"
- assertVisible: "Balance on record"

- tapOn: "500000"
- eraseText
- inputText: "450000"

# The correction is stated before it is written, and it is a difference, not an overwrite.
- assertVisible: "Adjustment to record"
- tapOn: "Save"

- assertVisible: "adjustment of"
- tapOn: "Done"

# The balance has moved, and the account is no longer flagged as unchecked.
- assertNotVisible: "Balance not checked yet"

# The adjustment is an ordinary transaction. This is the assertion that proves the app
# recorded the drift rather than quietly rewriting the balance to match.
- tapOn: "Back"
- tapOn: "Trans."
- assertVisible: "Adjustment"
- assertVisible: "Reconciled Gopay"
