appId: com.dvnnfrr.saku
name: Record an expense
---
# Task 8.10. An expense end to end, including creating a category and a subcategory
# inline, and then finding it in the Daily list.
#
# Runs against the first-run seed, which is Cash and Card and no categories: the sheet
# opens on Cash, and the category is made from the picker. If the seed ever stops
# running, the sheet has no account and this flow is what catches it.
- clearState
- launchApp

- assertVisible: "Nothing recorded this month"

- tapOn: "Add transaction"
- assertVisible: "New transaction"
- assertVisible: "Expense"

# 187 then 000, which is the keypad's whole reason for existing.
- tapOn: "1"
- tapOn: "8"
- tapOn: "7"
- tapOn: "000"
- assertVisible: "Rp 187.000"

# Category and subcategory, both created without leaving the sheet. With no categories
# the picker holds only its "New category" row.
- tapOn: "Category"
- tapOn: "New category"
- inputText: "Makan & Minum"
- tapOn: "Create"
- assertVisible: "Makan & Minum"

- tapOn: "Subcategory"
- tapOn: "New subcategory"
- inputText: "Warung Padang"
- tapOn: "Create"
- assertVisible: "Warung Padang"

- tapOn: "Save"

# Back on the list, with the row and the month header both updated.
- assertVisible: "Makan & Minum"
- assertVisible: "Warung Padang"
- assertNotVisible: "Nothing recorded this month"

# Reopening it must show what was saved, not an empty sheet.
- tapOn: "Makan & Minum"
- assertVisible: "Edit transaction"
- assertVisible: "Rp 187.000"
