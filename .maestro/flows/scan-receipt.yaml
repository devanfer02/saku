appId: com.dvnnfrr.saku
name: Scan a receipt
---
# receipt-items. A paper receipt and a payment screenshot, both through Scan on Trans and
# the photo picker, onto the Receipt screen, then saved as one row.
#
# Prerequisites, outside the app:
#
#  1. Both mock images on the device, and indexed so the photo picker lists them:
#       adb push data/mock-receipt-indomaret.png data/mock-receipt-ewallet.png /sdcard/Pictures/
#       adb shell content call --method scan_volume --uri content://media --arg external_primary
#     They are drawn by data/make-mock-receipts.py with invented items and are marked mock.
#  2. The photo picker is the system's, so the steps between "Choose from gallery" and
#     landing back in Saku are the one part of this flow that varies by device. The picker
#     lists the newest image first; the ewallet image is pushed last, so it is first.
#
# Saku holds no storage or camera permission: the picker and the system camera hand it a
# single image each time, which is why neither asks for anything. The long receipts and
# per-item saving were checked by hand over adb (receipt-items task group 6).
- clearState
- launchApp

# --- the paper receipt ----------------------------------------------------------
- tapOn: "Scan a receipt"
- assertVisible: "Receipts or payment screenshots"
- tapOn: "Choose from gallery"
# --- the system photo picker ----------------------------------------------------
- tapOn:
    id: "com.google.android.providers.media.module:id/icon_thumbnail"
    index: 1
# --------------------------------------------------------------------------------
- extendedWaitUntil:
    visible: "Rp 52.300"
    timeout: 15000
- assertVisible: "Receipt"
- assertVisible: "Indomaret"
- assertVisible: "Indomie Goreng Special.*"

# One row, a new category, then save, and Trans shows the row.
- tapOn: "One row"
- tapOn: "Category"
- tapOn: "New category"
- inputText: "Belanja"
- tapOn: "Create"
- tapOn: "Save 1 row"
- assertVisible: "Belanja"
- assertVisible: ".*Indomaret.*"

# --- the payment screenshot, through the same button -----------------------------
- tapOn: "Scan a receipt"
- tapOn: "Choose from gallery"
- tapOn:
    id: "com.google.android.providers.media.module:id/icon_thumbnail"
    index: 0
- extendedWaitUntil:
    visible: "Rp 46.500"
    timeout: 15000
- assertVisible: "No item rows found, so the receipt saves as one row."
- tapOn: "Choose category"
- tapOn: "Belanja"
- tapOn: "Save 1 row"
- assertVisible: ".*Warung Kopi Contoh.*"
